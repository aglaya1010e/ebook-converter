<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ebook Flow - Organic Converter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --sky-blue: #e0f2fe;
            --sage-green: #d1d5db;--mint-pastel: #f0fdf4;
            --teal-accent: #2dd4bf;
            --leaf-green: #4ade80;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #dcfce7 100%);
            min-height: 100vh;
        }
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
        }
        .organic-shape {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            transition: all 0.5s ease-in-out;
        }
        .organic-shape:hover {
            border-radius: 40% 60% 70% 30% / 40% 70% 30% 60%;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-morphism {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .floating-blob {
            position: absolute;
            z-index: -1;
            filter: blur(40px);
            opacity: 0.6;
        }
        .leaf-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        sky: {
                            100: "#e0f2fe",
                        },
                        mint: "#f0fdf4",
                        teal: {
                            400: "#2dd4bf",
                            600: "#0d9488",
                        }
                    }
                }
            }
        };
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center p-6 overflow-hidden relative">
<div class="floating-blob w-64 h-64 bg-teal-200 rounded-full top-[-10%] left-[-10%]"></div>
<div class="floating-blob w-80 h-80 bg-sky-200 rounded-full bottom-[-10%] right-[-10%]"></div>
<main class="w-full max-w-md relative">
<header class="text-center mb-10">
<h1 class="text-3xl font-bold text-teal-800 dark:text-teal-200 mb-2 flex items-center justify-center gap-2">
<span class="material-symbols-outlined leaf-icon text-teal-500">eco</span>
                Ebook Flow
            </h1>
<p class="text-teal-700/70 dark:text-teal-300/60 font-medium">
                Harmonizing your digital library
            </p>
</header>
<div class="glass-morphism rounded-[2.5rem] p-1.5 flex mb-10 shadow-sm">
<button class="flex-1 flex items-center justify-center py-3 px-4 rounded-[2rem] bg-white/60 dark:bg-teal-800/40 text-teal-900 dark:text-teal-50 shadow-sm transition-all duration-300">
<span class="material-symbols-outlined mr-2 text-teal-600">auto_stories</span>
<span class="font-semibold">Converter</span>
</button>
<button class="flex-1 flex items-center justify-center py-3 px-4 rounded-[2rem] text-teal-700/60 dark:text-teal-400/60 hover:text-teal-800 transition-all duration-300">
<span class="material-symbols-outlined mr-2 opacity-60">content_cut</span>
<span class="font-semibold">Splitter</span>
</button>
</div>
<div class="relative group">
<div class="absolute inset-0 bg-teal-300/20 blur-2xl group-hover:bg-teal-300/30 transition-all"></div>
<div class="glass-morphism organic-shape min-h-[380px] p-10 flex flex-col items-center justify-center text-center shadow-lg relative z-10 overflow-hidden cursor-pointer">
<div class="mb-8 p-6 bg-teal-100/50 dark:bg-teal-900/30 rounded-full">
<span class="material-symbols-outlined text-6xl text-teal-600 dark:text-teal-300" style="font-size: 4.5rem;">
                        water_drop
                    </span>
</div>
<h2 class="text-xl font-bold text-teal-900 dark:text-teal-50 mb-4 px-4 leading-snug">
                    Release your files here for a seamless transformation
                </h2>
<div class="flex flex-wrap justify-center gap-2 mb-6">
<span class="px-4 py-1.5 rounded-full bg-teal-500/10 dark:bg-teal-400/10 text-teal-700 dark:text-teal-300 text-xs font-bold border border-teal-500/20">EPUB</span>
<span class="px-4 py-1.5 rounded-full bg-teal-500/10 dark:bg-teal-400/10 text-teal-700 dark:text-teal-300 text-xs font-bold border border-teal-500/20">MOBI</span>
<span class="px-4 py-1.5 rounded-full bg-teal-500/10 dark:bg-teal-400/10 text-teal-700 dark:text-teal-300 text-xs font-bold border border-teal-500/20">FB2</span>
</div>
<div class="flex items-center gap-2 text-teal-500/50">
<span class="material-symbols-outlined">expand_more</span>
</div>
<div class="mt-4 px-6 py-2 rounded-full bg-teal-600 text-white text-sm font-bold shadow-md shadow-teal-500/20">
                    TXT
                </div>
</div>
</div>
<footer class="mt-12 flex flex-col items-center gap-4">
<div class="glass-morphism px-6 py-3 rounded-full flex items-center space-x-3">
<span class="material-symbols-outlined text-teal-600 text-lg">verified_user</span>
<p class="text-xs text-teal-900/70 dark:text-teal-200/70 font-semibold tracking-wide">
                    Naturally secure. Local processing only.
                </p>
</div>
</footer>
</main>
<div class="fixed top-6 right-6 flex flex-col gap-3">
<button class="w-12 h-12 flex items-center justify-center rounded-full glass-morphism text-teal-800 dark:text-teal-100 hover:scale-110 transition-transform" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-full glass-morphism text-teal-800 dark:text-teal-100 hover:scale-110 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
</div>

</body></html>
